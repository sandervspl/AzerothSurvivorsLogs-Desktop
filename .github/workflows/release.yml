name: Prepare managed desktop download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (desktop-vX.Y.Z)
        required: true
      signed_installer:
        description: Apply optional Windows publisher signing (requires Azure configuration)
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  package:
    runs-on: windows-latest
    env:
      AZS_RELEASE_PUBLIC_KEYS: ${{ vars.AZS_RELEASE_PUBLIC_KEYS }}
      AZS_RELEASE_CATALOG_URL: https://raw.githubusercontent.com/sandervspl/AzerothSurvivorsLogs-Desktop/updates/stable.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release inputs before building
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^desktop-v\d+\.\d+\.\d+$') { throw 'Invalid desktop tag' }
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:TAG -ne "desktop-v$version" -or -not $env:AZS_RELEASE_PUBLIC_KEYS) { throw 'Configure update trust and match the Cargo version before releasing.' }
      - name: Prepare optional publisher signing
        if: inputs.signed_installer
        shell: pwsh
        env:
          SIGNING_METADATA: ${{ secrets.AZS_WINDOWS_SIGNING_METADATA }}
        run: |
          if (-not $env:SIGNING_METADATA) { throw 'Configure Azure signing metadata first.' }
          New-Item -ItemType Directory -Path .state -Force | Out-Null
          $metadata = Join-Path $PWD '.state/windows-signing.json'
          [IO.File]::WriteAllText($metadata, $env:SIGNING_METADATA)
          "AZS_WINDOWS_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: azure/login@v2
        if: inputs.signed_installer
        with:
          client-id: ${{ vars.AZS_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZS_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZS_SIGNING_SUBSCRIPTION_ID }}
      - name: Package and verify production installer
        shell: pwsh
        env:
          SIGNED: ${{ inputs.signed_installer }}
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path .cache/vpk
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          $options = @{ Vpk = '.cache/vpk/vpk.exe' }
          if ($env:SIGNED -ne 'true') { $options.Unsigned = $true }
          ./scripts/package-managed-desktop.ps1 @options
      - name: Draft managed installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $source = Get-Content SOURCE_COMMIT
          $installer = Get-Content artifacts/desktop-release/installer.json | ConvertFrom-Json
          $notes = "Windows managed installer ($($installer.codeSigning)). Source monorepo commit: $source. Unsigned installers may show Windows publisher/reputation warnings. Updates still require the authenticated catalog. Publishing this release does not promote the catalog."
          New-Item -ItemType Directory -Path .state -Force | Out-Null
          $notes | Set-Content .state/release-notes.md
          gh release create $env:TAG artifacts/desktop-release/*Setup.exe artifacts/desktop-release/*-full.nupkg artifacts/desktop-release/releases.stable.json artifacts/desktop-release/installer.json artifacts/desktop-release/publisher-signature-verification.json artifacts/desktop-release/embedded-update-trust.json --target $env:GITHUB_SHA --draft --title $env:TAG --notes-file .state/release-notes.md
