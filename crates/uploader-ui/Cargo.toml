[package]
name = "azs-uploader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
azs-uploader-core = { path = "../uploader-core" }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest", "font-kit", "wayland", "x11"] }
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
open = "5"
velopack = { version = "=1.2.161", features = ["public-utils"] }
sha2.workspace = true
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[[bin]]
name = "azs-update-guard"
path = "src/update_guard.rs"
